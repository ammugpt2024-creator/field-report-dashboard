
[functions.send-qc-email]
enabled = true
# The function itself also requires a token that resolves to a real user: the
# anon key is a valid JWT and ships in the app bundle, so it is not identity.
verify_jwt = true
import_map = "./functions/send-qc-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-qc-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-qc-email/*.html" ]

[functions.generate-daily-summary]
enabled = true
verify_jwt = true
entrypoint = "./functions/generate-daily-summary/index.ts"
